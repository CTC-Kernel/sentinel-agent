[framework]
id = "NIST_CSF"
name = "NIST Cybersecurity Framework"
version = "2.0"
description = "Framework for managing cybersecurity risk (CSF 2.0, February 2024)"
applicability = ["Critical Infrastructure", "Federal Agencies", "Global Organizations"]
reference_url = "https://www.nist.gov/cyberframework"

# Subcategory ids and texts of CSF 2.0. Former CSF 1.1 ids (in comments) were
# moved with NIST's "CSF 2.0 Core With Withdrawn CSF 1.1 Elements": when a 1.1
# subcategory was incorporated into several 2.0 ones, only those the check
# actually shows are kept. Dropped because the 2.0 text no longer describes
# what the check verifies: DE.AE-03 (now correlation only; log generation is
# PR.PS-04), RC.RP-01 for backups (recovery plan execution), DE.CM-01 for the
# host firewall (network monitoring), ID.AM-04 for certificates (supplier
# services inventory), PR.DS-6 for containers (image signing is not checked)
# and for Linux hardening (neither PR.DS-01 nor DE.CM-09 fits).

# disk_encryption — CSF 1.1: PR.DS-1, PR.DS-5
[[controls]]
check_id = "disk_encryption"
control_id = "PR.DS-01"
control_name = "The confidentiality, integrity, and availability of data-at-rest are protected"
category = "Protect"
description = "Full-disk encryption protects data at rest"
weight = 0.9
is_critical = true

# firewall_active — CSF 1.1: PR.AC-5, DE.CM-1
[[controls]]
check_id = "firewall_active"
control_id = "PR.IR-01"
control_name = "Networks and environments are protected from unauthorized logical access and usage"
category = "Protect"
description = "The host firewall filters network access to the device"
weight = 0.9
is_critical = true

# antivirus_active — CSF 1.1: DE.CM-4, PR.DS-6
[[controls]]
check_id = "antivirus_active"
control_id = "DE.CM-09"
control_name = "Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events"
category = "Detect"
description = "Active, up-to-date anti-malware monitors the device for malicious code"
weight = 0.9
is_critical = true

# mfa_enabled — CSF 1.1: PR.AC-7
[[controls]]
check_id = "mfa_enabled"
control_id = "PR.AA-03"
control_name = "Users, services, and hardware are authenticated"
category = "Protect"
description = "Multi-factor authentication is configured"
weight = 0.95
is_critical = true

# password_policy — CSF 1.1: PR.AC-1
[[controls]]
check_id = "password_policy"
control_id = "PR.AA-01"
control_name = "Identities and credentials for authorized users, services, and hardware are managed by the organization"
category = "Protect"
description = "The local password policy enforces credential strength"
weight = 0.8
is_critical = true

# patches_current — CSF 1.1: PR.IP-12, ID.RA-1
[[controls]]
check_id = "patches_current"
control_id = "PR.PS-02"
control_name = "Software is maintained, replaced, and removed commensurate with risk"
category = "Protect"
description = "Available security updates are installed"
weight = 0.9
is_critical = true

[[controls]]
check_id = "patches_current"
control_id = "ID.RA-01"
control_name = "Vulnerabilities in assets are identified, validated, and recorded"
category = "Identify"
description = "Missing security updates are identified and recorded"
weight = 0.7
is_critical = false

