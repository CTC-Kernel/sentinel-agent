# Directive (UE) 2022/2555 (NIS 2), article 21, paragraphe 2 : mesures de
# gestion des risques en matière de cybersécurité.
#
# Seules les mesures vérifiables sur un poste sont reliées à des contrôles.
# Les points (a) politiques d'analyse des risques, (d) sécurité de la chaîne
# d'approvisionnement et (f) évaluation de l'efficacité des mesures relèvent
# de l'organisation et ne sont pas mesurables par l'agent.

[framework]
id = "NIS2"
name = "Directive NIS 2 (UE) 2022/2555"
version = "2022/2555"
description = "Mesures de gestion des risques de l'article 21, paragraphe 2, vérifiables sur un poste"
applicability = ["Entités essentielles", "Entités importantes", "Union européenne"]
reference_url = "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"

# ========================================================================
