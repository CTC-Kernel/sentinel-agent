[framework]
id = "ANSSI_HYGIENE"
name = "ANSSI Guide d'Hygiène Informatique"
version = "2.0"
description = "42 mesures du Guide d'hygiène informatique (ANSSI, 2017) ; seules les mesures qu'une vérification de poste démontre sont rattachées"
applicability = ["TPE/PME", "France", "Europe"]
reference_url = "https://www.ssi.gouv.fr/guide/guide-dhygiene-informatique/"

# Codes M01–M42 et intitulés = mesures officielles du guide v2.0, tels que le
# catalogue de la plateforme les importe (ANSSI_HYGIENE_SEED_CONTROLS). Une
# vérification n'est rattachée qu'à une mesure dont le texte cite ce qu'elle
# contrôle. Aucune mesure ne couvre le verrouillage de session (cité seulement
# comme sujet de sensibilisation, M02), le démarrage sécurisé, les paramètres du
# noyau, le magasin de certificats ou les conteneurs : screen_lock, secure_boot,
# kernel_hardening, certificate_validation et container_security n'ont donc pas
# de rattachement ANSSI.

# ========================================================================
# II — Connaître le système d'information
# ========================================================================

[[controls]]
check_id = "privileged_groups"
control_id = "M05"
control_name = "Disposer d’un inventaire exhaustif des comptes privilégiés et le maintenir à jour"
category = "Connaître le système d'information"
description = "Les membres des groupes privilégiés (Domain Admins, Enterprise Admins, Schema Admins, Administrateurs locaux) sont relevés à chaque analyse"
weight = 0.85
is_critical = true

[[controls]]
check_id = "admin_accounts"
control_id = "M05"
control_name = "Disposer d’un inventaire exhaustif des comptes privilégiés et le maintenir à jour"
category = "Connaître le système d'information"
description = "Les comptes administrateurs locaux du poste sont relevés à chaque analyse"
weight = 0.6
is_critical = false

# ========================================================================
# III — Authentifier et contrôler les accès
# ========================================================================

[[controls]]
check_id = "guest_account_disabled"
control_id = "M08"
control_name = "Identifier nommément chaque personne accédant au système et distinguer les rôles utilisateur/administrateur"
category = "Authentifier et contrôler les accès"
description = "Le compte invité, compte générique non nominatif, est désactivé"
weight = 0.6
is_critical = false

[[controls]]
check_id = "password_policy"
control_id = "M10"
control_name = "Définir et vérifier des règles de choix et de dimensionnement des mots de passe"
category = "Authentifier et contrôler les accès"
description = "La politique de mots de passe locale impose une longueur minimale et la complexité"
weight = 0.95
is_critical = true

[[controls]]
check_id = "gpo_password_policy"
control_id = "M10"
control_name = "Définir et vérifier des règles de choix et de dimensionnement des mots de passe"
category = "Authentifier et contrôler les accès"
description = "La politique de mots de passe de domaine impose longueur, complexité, historique et durée de vie"
weight = 0.9
is_critical = true

[[controls]]
check_id = "gpo_account_lockout"
control_id = "M10"
control_name = "Définir et vérifier des règles de choix et de dimensionnement des mots de passe"
category = "Authentifier et contrôler les accès"
description = "Les comptes sont bloqués après plusieurs échecs de connexion, moyen de vérification cité par la mesure"
weight = 0.85
is_critical = true

[[controls]]
check_id = "guest_account_disabled"
control_id = "M10"
control_name = "Définir et vérifier des règles de choix et de dimensionnement des mots de passe"
category = "Authentifier et contrôler les accès"
description = "La connexion anonyme par le compte invité est désactivée, moyen de vérification cité par la mesure"
weight = 0.5
is_critical = false

[[controls]]
check_id = "ldap_security"
control_id = "M10"
control_name = "Définir et vérifier des règles de choix et de dimensionnement des mots de passe"
category = "Authentifier et contrôler les accès"
description = "L'annuaire LDAP refuse la connexion anonyme (anonymous bind), moyen de vérification cité par la mesure"
weight = 0.6
is_critical = false

[[controls]]
check_id = "mfa_enabled"
control_id = "M13"
control_name = "Privilégier lorsque c’est possible une authentification forte"
category = "Authentifier et contrôler les accès"
description = "Une authentification à deux facteurs est configurée sur le poste"
weight = 0.9
is_critical = true

# ========================================================================
# IV — Sécuriser les postes
# ========================================================================

[[controls]]
check_id = "antivirus_active"
control_id = "M14"
control_name = "Mettre en place un niveau de sécurité minimal sur l’ensemble du parc informatique"
category = "Sécuriser les postes"
description = "Un antivirus actif et à jour équipe le poste, comme la mesure l'exige"
weight = 0.95
is_critical = true

[[controls]]
check_id = "firewall_active"
control_id = "M14"
control_name = "Mettre en place un niveau de sécurité minimal sur l’ensemble du parc informatique"
category = "Sécuriser les postes"
description = "Le pare-feu local du poste est actif, comme la mesure l'exige"
weight = 0.85
is_critical = true

[[controls]]
check_id = "disk_encryption"
control_id = "M14"
control_name = "Mettre en place un niveau de sécurité minimal sur l’ensemble du parc informatique"
category = "Sécuriser les postes"
description = "Les partitions qui portent les données des utilisateurs sont chiffrées, comme la mesure l'exige"
weight = 0.85
is_critical = true

[[controls]]
check_id = "usb_storage_disabled"
control_id = "M15"
control_name = "Se protéger des menaces relatives à l’utilisation de supports amovibles"
category = "Sécuriser les postes"
description = "Les supports de stockage USB sont bloqués par politique sur le poste"
weight = 0.8
is_critical = false

[[controls]]
check_id = "firewall_active"
control_id = "M17"
control_name = "Activer et configurer le pare-feu local des postes de travail"
category = "Sécuriser les postes"
description = "Le pare-feu local (pare-feu Windows, iptables/nftables/ufw, pare-feu macOS) est actif"
weight = 0.95
is_critical = true

# ========================================================================
# V — Sécuriser le réseau
# ========================================================================

[[controls]]
check_id = "obsolete_protocols"
control_id = "M21"
control_name = "Utiliser des protocoles sécurisés dès qu’ils existent"
category = "Sécuriser le réseau"
description = "SMBv1, SSLv3, TLS 1.0 et TLS 1.1 sont désactivés"
weight = 0.85
is_critical = true

[[controls]]
check_id = "ssh_hardening"
control_id = "M21"
control_name = "Utiliser des protocoles sécurisés dès qu’ils existent"
category = "Sécuriser le réseau"
description = "SSH en version 2 uniquement, avec des algorithmes de chiffrement et de MAC robustes"
weight = 0.85
is_critical = true

[[controls]]
check_id = "ldap_security"
control_id = "M21"
control_name = "Utiliser des protocoles sécurisés dès qu’ils existent"
category = "Sécuriser le réseau"
description = "Les échanges avec l'annuaire LDAP sont protégés par TLS"
weight = 0.85
is_critical = true

[[controls]]
check_id = "dns_security"
control_id = "M21"
control_name = "Utiliser des protocoles sécurisés dès qu’ils existent"
category = "Sécuriser le réseau"
description = "La résolution DNS est chiffrée (DNS over TLS ou DNS over HTTPS) et validée par DNSSEC"
weight = 0.7
is_critical = false

[[controls]]
check_id = "remote_access_secure"
control_id = "M21"
control_name = "Utiliser des protocoles sécurisés dès qu’ils existent"
category = "Sécuriser le réseau"
description = "Le bureau à distance exige l'authentification préalable (NLA) et un niveau de chiffrement élevé"
weight = 0.7
is_critical = false

# ========================================================================
# VI — Sécuriser l'administration
# ========================================================================

[[controls]]
check_id = "admin_accounts"
control_id = "M29"
control_name = "Limiter au strict besoin opérationnel les droits d’administration sur les postes de travail"
category = "Sécuriser l'administration"
description = "Le nombre de comptes administrateurs locaux du poste reste limité (alerte au-delà de 3)"
weight = 0.9
is_critical = true

# ========================================================================
# VII — Gérer le nomadisme
# ========================================================================

[[controls]]
check_id = "disk_encryption"
control_id = "M31"
control_name = "Chiffrer les données sensibles, en particulier sur le matériel potentiellement perdable"
category = "Gérer le nomadisme"
description = "Le disque est chiffré intégralement (BitLocker, LUKS, FileVault), solution que la mesure recommande en premier"
weight = 0.95
is_critical = true

# ========================================================================
# VIII — Maintenir à jour le système d'information
# ========================================================================

[[controls]]
check_id = "patches_current"
control_id = "M34"
control_name = "Définir une politique de mise à jour des composants du système d’information"
category = "Maintenir à jour le système d'information"
description = "Les mises à jour de sécurité disponibles sont installées"
weight = 0.95
is_critical = true

[[controls]]
check_id = "update_status"
control_id = "M34"
control_name = "Définir une politique de mise à jour des composants du système d’information"
category = "Maintenir à jour le système d'information"
description = "Service de mise à jour actif, dernière installation, mises à jour en attente et configuration WSUS suivis"
weight = 0.9
is_critical = true

# ========================================================================
# IX — Superviser, auditer, réagir
# ========================================================================

[[controls]]
check_id = "audit_logging"
control_id = "M36"
control_name = "Activer et configurer les journaux des composants les plus importants"
category = "Superviser, auditer, réagir"
description = "Le service de journalisation d'audit du système est actif"
weight = 0.9
is_critical = true

[[controls]]
check_id = "gpo_audit_policy"
control_id = "M36"
control_name = "Activer et configurer les journaux des composants les plus importants"
category = "Superviser, auditer, réagir"
description = "La stratégie d'audit journalise les ouvertures de session, la gestion des comptes et l'usage des privilèges"
weight = 0.85
is_critical = true

[[controls]]
check_id = "log_rotation"
control_id = "M36"
control_name = "Activer et configurer les journaux des composants les plus importants"
category = "Superviser, auditer, réagir"
description = "La rotation et la taille maximale des journaux sont configurées, paramètres cités par la mesure"
weight = 0.6
is_critical = false

[[controls]]
check_id = "time_sync"
control_id = "M36"
control_name = "Activer et configurer les journaux des composants les plus importants"
category = "Superviser, auditer, réagir"
description = "L'horloge est synchronisée par NTP, condition posée par la mesure pour corréler les journaux"
