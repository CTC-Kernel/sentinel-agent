is_critical = false

[[controls]]
check_id = "backup_configured"
control_id = "M37"
control_name = "Définir et appliquer une politique de sauvegarde des composants critiques"
category = "Superviser, auditer, réagir"
description = "Une sauvegarde est configurée et la dernière date de moins de 30 jours"
weight = 0.95
is_critical = true
