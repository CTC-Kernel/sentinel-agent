# Règlement (UE) 2022/2554 (DORA), chapitre II : gestion du risque lié aux
# technologies de l'information et de la communication (TIC).
#
# Seules les exigences vérifiables sur un poste sont reliées à des contrôles.
# La gouvernance (article 5), le cadre de gestion du risque (article 6),
# l'identification (article 8), la réponse et le rétablissement (article 11)
# et les chapitres III à V (incidents, tests, prestataires tiers) relèvent de
# l'organisation et ne sont pas mesurables par l'agent.

[framework]
id = "DORA"
name = "Règlement DORA (UE) 2022/2554"
version = "2022/2554"
description = "Gestion du risque lié aux TIC (articles 7, 9, 10 et 12) : exigences vérifiables sur un poste"
applicability = ["Entités financières", "Union européenne"]
reference_url = "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"

