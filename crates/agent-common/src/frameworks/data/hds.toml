[framework]
id = "HDS"
name = "HDS — Hébergeur de données de santé"
version = "2"
description = "Référentiel de certification HDS v2 : exigences d'hébergement vérifiables sur un poste, socle ISO/IEC 27001 exigé sur le périmètre HDS"
applicability = ["Hébergeurs de données de santé", "France"]
reference_url = "https://esante.gouv.fr/produits-services/hds"

# Codes HDS.x.y et intitulés = exigences du catalogue de la plateforme
# (HDS_SEED_CONTROLS). Une vérification est rattachée à l'exigence HDS propre
# qu'elle démontre (authentification forte, chiffrement au repos et des flux,
# traçabilité, sauvegardes). Les autres vérifications démontrent une mesure de
# l'annexe A d'ISO/IEC 27001 (citée dans la description) : HDS v2 n'a pas
# d'exigence technique propre pour elles, il exige le SMSI ISO/IEC 27001 sur le
# périmètre HDS, d'où leur rattachement à HDS.1.5 avec un poids réduit.
# Gouvernance (HDS.1.1–1.4, 1.6), obligations de sous-traitant (HDS.2.x),
# continuité, niveaux de service et réversibilité (HDS.4.2–4.4), localisation
# (HDS.5.x), contrat et incidents (HDS.6.x) ne se vérifient pas sur un poste.

# ========================================================================
# HDS.3 — Sécurité technique
# ========================================================================

[[controls]]
check_id = "mfa_enabled"
control_id = "HDS.3.1"
control_name = "Authentification forte des utilisateurs et des administrateurs"
category = "Sécurité technique"
description = "Une authentification multifacteur est configurée sur le poste"
weight = 0.95
is_critical = true

[[controls]]
check_id = "disk_encryption"
control_id = "HDS.3.2"
control_name = "Chiffrement des données de santé au repos"
category = "Sécurité technique"
description = "Le disque qui peut porter des données de santé est chiffré (BitLocker, LUKS, FileVault)"
weight = 0.9
is_critical = true

[[controls]]
check_id = "obsolete_protocols"
control_id = "HDS.3.3"
control_name = "Chiffrement des flux de données de santé"
category = "Sécurité technique"
description = "SMBv1, SSLv3, TLS 1.0 et TLS 1.1 sont désactivés : les flux du poste ne peuvent pas être négociés en chiffrement faible"
weight = 0.85
is_critical = true

[[controls]]
check_id = "certificate_validation"
control_id = "HDS.3.3"
control_name = "Chiffrement des flux de données de santé"
category = "Sécurité technique"
description = "Le magasin de certificats ne contient ni certificat expiré, ni racine auto-signée ajoutée, ni signature faible (MD5, SHA-1)"
weight = 0.8
is_critical = true

[[controls]]
check_id = "ldap_security"
control_id = "HDS.3.3"
control_name = "Chiffrement des flux de données de santé"
category = "Sécurité technique"
description = "Les échanges avec l'annuaire LDAP sont protégés par TLS"
weight = 0.8
is_critical = true

[[controls]]
check_id = "ssh_hardening"
control_id = "HDS.3.3"
control_name = "Chiffrement des flux de données de santé"
category = "Sécurité technique"
description = "SSH en version 2 uniquement, avec des algorithmes de chiffrement et de MAC robustes"
weight = 0.8
is_critical = true

[[controls]]
check_id = "remote_access_secure"
control_id = "HDS.3.3"
control_name = "Chiffrement des flux de données de santé"
category = "Sécurité technique"
description = "Le bureau à distance exige l'authentification préalable (NLA) et un niveau de chiffrement élevé"
weight = 0.6
is_critical = false

[[controls]]
check_id = "audit_logging"
control_id = "HDS.3.4"
control_name = "Traçabilité des accès aux données de santé"
category = "Sécurité technique"
description = "Le service de journalisation d'audit du système est actif"
weight = 0.9
is_critical = true

[[controls]]
check_id = "gpo_audit_policy"
control_id = "HDS.3.4"
control_name = "Traçabilité des accès aux données de santé"
category = "Sécurité technique"
description = "La stratégie d'audit journalise les ouvertures de session, la gestion des comptes et l'usage des privilèges"
weight = 0.9
is_critical = true

[[controls]]
check_id = "log_rotation"
control_id = "HDS.3.4"
control_name = "Traçabilité des accès aux données de santé"
category = "Sécurité technique"
description = "La rotation et la conservation des journaux sont configurées"
weight = 0.6
is_critical = false

[[controls]]
check_id = "time_sync"
control_id = "HDS.3.4"
control_name = "Traçabilité des accès aux données de santé"
category = "Sécurité technique"
description = "L'horloge est synchronisée par NTP : les traces sont horodatées de façon fiable"
weight = 0.6
is_critical = false

# ========================================================================
# HDS.4 — Disponibilité, continuité et réversibilité
# ========================================================================

[[controls]]
check_id = "backup_configured"
control_id = "HDS.4.1"
control_name = "Sauvegardes externalisées des données de santé et tests de restauration"
category = "Disponibilité, continuité et réversibilité"
description = "Une sauvegarde est configurée et la dernière date de moins de 30 jours (externalisation et tests de restauration non vérifiés par l'agent)"
weight = 0.9
is_critical = true

