# Certification HDS (hébergeur de données de santé), référentiel version 2.
#
# La certification exige un système de management de la sécurité conforme à
# ISO/IEC 27001. Ce catalogue reprend les contrôles de l'annexe A
# d'ISO/IEC 27001:2022 vérifiables sur un poste (mêmes identifiants).
# Les exigences propres au référentiel HDS — contractuelles, localisation des
# données, transparence envers les clients — relèvent de l'organisation et ne
# sont pas mesurables par l'agent.

[framework]
id = "HDS"
name = "HDS — Hébergeur de données de santé"
version = "2"
description = "Socle ISO/IEC 27001:2022 exigé par la certification HDS : contrôles de l'annexe A vérifiables sur un poste"
applicability = ["Hébergeurs de données de santé", "France"]
reference_url = "https://esante.gouv.fr/produits-services/hds"

