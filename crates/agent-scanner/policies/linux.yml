  - id: 1050
    title: "/tmp monté avec nodev"
    description: "Aucun fichier de périphérique ne doit être interprété dans /tmp, où tout compte peut écrire. Le contrôle échoue aussi si /tmp n'est pas un montage séparé."
    remediation: "Ajouter l'option nodev à la ligne de /tmp dans /etc/fstab, puis remonter."
    severity: low
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/mounts -> r:\s/tmp\s && r:nodev'
  - id: 1051
    title: "/tmp monté avec nosuid"
    description: "Aucun programme set-user-ID ne doit agir depuis /tmp, où tout compte peut écrire. Le contrôle échoue aussi si /tmp n'est pas un montage séparé."
    remediation: "Ajouter l'option nosuid à la ligne de /tmp dans /etc/fstab, puis remonter."
