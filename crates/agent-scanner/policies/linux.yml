# Politique de conformité livrée avec l'agent Sentinel GRC.
#
# Même format que les politiques SCA de Wazuh : vos propres politiques, ou
# celles écrites pour Wazuh, se déposent dans le dossier « sca.d » du dossier
# de données de l'agent. Champs propres à Sentinel : « severity »,
# « category » (par contrôle) et « platforms » (par politique).

policy:
  id: sentinel_linux
  name: "Durcissement Linux — socle Sentinel"
  description: "Réglages du noyau, comptes, SSH, droits des fichiers système et services hérités."
  platforms: [linux]

checks:
  - id: 1001
    title: "Routage IPv4 désactivé"
    description: "Le poste ne doit pas relayer de paquets entre ses interfaces, sauf s'il est routeur ou héberge des conteneurs."
    remediation: "sysctl -w net.ipv4.ip_forward=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/ip_forward -> 0'
  - id: 1002
    title: "Redirections ICMP refusées"
    description: "Une redirection ICMP forgée détourne le trafic du poste vers une machine de l'attaquant."
    remediation: "sysctl -w net.ipv4.conf.all.accept_redirects=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/accept_redirects -> 0'
  - id: 1003
    title: "Redirections ICMP refusées sur les nouvelles interfaces"
    description: "Le réglage par défaut s'applique aux interfaces créées après le démarrage."
    remediation: "sysctl -w net.ipv4.conf.default.accept_redirects=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/default/accept_redirects -> 0'
  - id: 1004
    title: "Redirections ICMP des passerelles refusées"
    description: "Même venant d'une passerelle connue, une redirection ICMP peut être forgée."
    remediation: "sysctl -w net.ipv4.conf.all.secure_redirects=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/secure_redirects -> 0'
  - id: 1005
    title: "Envoi de redirections ICMP désactivé"
    description: "Seul un routeur envoie des redirections ICMP."
    remediation: "sysctl -w net.ipv4.conf.all.send_redirects=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/send_redirects -> 0'
  - id: 1006
    title: "Routage par la source refusé"
    description: "Le routage par la source laisse l'émetteur choisir le chemin et contourner le filtrage."
    remediation: "sysctl -w net.ipv4.conf.all.accept_source_route=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/accept_source_route -> 0'
  - id: 1007
    title: "Paquets à adresse impossible journalisés"
    description: "Un paquet dont l'adresse source ne peut pas venir de cette interface trahit une usurpation."
    remediation: "sysctl -w net.ipv4.conf.all.log_martians=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: audit_logging
    compliance:
      - iso_27001: ["A.8.15"]
      - cis_csc_v8: ["8"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/log_martians -> 1'
  - id: 1008
    title: "Ping de diffusion ignoré"
    description: "Répondre aux pings de diffusion fait du poste un amplificateur d'attaque par déni de service."
    remediation: "sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/icmp_echo_ignore_broadcasts -> 1'
  - id: 1009
    title: "Réponses d'erreur ICMP invalides ignorées"
    description: "Évite de remplir les journaux de réponses ICMP forgées."
    remediation: "sysctl -w net.ipv4.icmp_ignore_bogus_error_responses=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/icmp_ignore_bogus_error_responses -> 1'
  - id: 1010
    title: "Filtrage par chemin inverse actif"
    description: "Un paquet arrivant par une interface d'où sa source n'est pas joignable est rejeté, ce qui bloque l'usurpation d'adresse."
    remediation: "sysctl -w net.ipv4.conf.all.rp_filter=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/rp_filter -> r:^1$|^2$'
  - id: 1011
    title: "Protection contre l'inondation SYN active"
    description: "Les cookies SYN gardent le poste joignable pendant une inondation de demandes de connexion."
    remediation: "sysctl -w net.ipv4.tcp_syncookies=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/tcp_syncookies -> 1'
  - id: 1012
    title: "Redirections ICMPv6 refusées"
    description: "Comme en IPv4, une redirection forgée détourne le trafic."
    remediation: "sysctl -w net.ipv6.conf.all.accept_redirects=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv6/conf/all/accept_redirects -> 0'
  - id: 1013
    title: "Routage par la source IPv6 refusé"
    description: "Le routage par la source laisse l'émetteur choisir le chemin et contourner le filtrage."
    remediation: "sysctl -w net.ipv6.conf.all.accept_source_route=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv6/conf/all/accept_source_route -> 0'
  - id: 1014
    title: "Annonces de routeur IPv6 refusées"
    description: "Une annonce de routeur forgée fait du poste de l'attaquant la passerelle IPv6. À laisser actif sur un poste qui s'autoconfigure en IPv6."
    remediation: "sysctl -w net.ipv6.conf.all.accept_ra=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: network_hardening
    compliance:
      - iso_27001: ["A.8.20"]
      - cis_csc_v8: ["12"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv6/conf/all/accept_ra -> 0'
  - id: 1020
    title: "Disposition aléatoire de la mémoire (ASLR) complète"
    description: "L'ASLR rend imprévisibles les adresses qu'un code d'exploitation doit connaître."
    remediation: "sysctl -w kernel.randomize_va_space=2 puis l'inscrire dans /etc/sysctl.d/."
    severity: high
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/randomize_va_space -> 2'
  - id: 1021
    title: "Journal du noyau réservé aux administrateurs"
    description: "Le journal du noyau révèle des adresses mémoire utiles à une élévation de privilèges."
    remediation: "sysctl -w kernel.dmesg_restrict=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/dmesg_restrict -> 1'
  - id: 1022
    title: "Adresses du noyau masquées"
    description: "Les adresses du noyau affichées dans /proc aident à contourner l'ASLR du noyau."
    remediation: "sysctl -w kernel.kptr_restrict=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/kptr_restrict -> r:^1$|^2$'
  - id: 1023
    title: "Attachement aux processus restreint (ptrace)"
    description: "Sans restriction, un processus compromis lit la mémoire des autres processus du même compte : mots de passe, clés, jetons."
    remediation: "sysctl -w kernel.yama.ptrace_scope=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/yama/ptrace_scope -> n:^(\d+) compare >= 1'
  - id: 1024
    title: "Pas d'image mémoire pour les programmes privilégiés"
    description: "L'image mémoire d'un programme set-user-ID contient des données que son lanceur ne doit pas lire."
    remediation: "sysctl -w fs.suid_dumpable=0 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/fs/suid_dumpable -> 0'
  - id: 1025
    title: "Liens physiques protégés"
    description: "Empêche un utilisateur de créer un lien vers un fichier qu'il ne possède pas pour le faire modifier par un programme privilégié."
    remediation: "sysctl -w fs.protected_hardlinks=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/fs/protected_hardlinks -> 1'
  - id: 1026
    title: "Liens symboliques protégés"
    description: "Bloque les attaques par lien symbolique dans les dossiers partagés comme /tmp."
    remediation: "sysctl -w fs.protected_symlinks=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/fs/protected_symlinks -> 1'
  - id: 1027
    title: "BPF réservé aux comptes privilégiés"
    description: "Le chargement de programmes BPF par un compte ordinaire a servi à de nombreuses élévations de privilèges."
    remediation: "sysctl -w kernel.unprivileged_bpf_disabled=1 puis l'inscrire dans /etc/sysctl.d/."
    severity: medium
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/unprivileged_bpf_disabled -> n:^(\d+) compare >= 1'
  - id: 1028
    title: "Compteurs de performance restreints"
    description: "Les compteurs de performance du noyau donnent à un compte ordinaire des informations exploitables par canal auxiliaire."
    remediation: "sysctl -w kernel.perf_event_paranoid=2 puis l'inscrire dans /etc/sysctl.d/."
    severity: low
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/perf_event_paranoid -> n:^(\d+) compare >= 2'
  - id: 1040
    title: "Module noyau cramfs non chargeable"
    description: "Système de fichiers compressé ancien, rarement utilisé. Un module inutile élargit la surface d'attaque du noyau."
    remediation: "Créer /etc/modprobe.d/cramfs.conf avec « install cramfs /bin/false » et « blacklist cramfs »."
    severity: low
    category: kernel_security
    compliance:
      - iso_27001: ["A.8.9"]
      - cis_csc_v8: ["4"]
    condition: all
    rules:
      - 'c:modprobe -n -v cramfs -> r:install /bin/true|install /bin/false|not found'
      - 'not c:lsmod -> r:^cramfs\s'
  - id: 1041
    title: "Module noyau freevxfs non chargeable"
