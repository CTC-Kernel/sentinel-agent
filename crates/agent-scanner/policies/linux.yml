  - id: 1060
    title: "Durée de vie maximale des mots de passe définie"
    description: "Un mot de passe qui n'expire jamais reste utilisable indéfiniment après avoir fuité."
    remediation: "Fixer PASS_MAX_DAYS à 365 ou moins dans /etc/login.defs."
    severity: medium
    category: authentication
    compliance:
      - iso_27001: ["A.5.17"]
      - cis_csc_v8: ["5"]
    condition: all
    rules:
      - 'f:/etc/login.defs -> n:^\s*PASS_MAX_DAYS\s+(\d+) compare <= 365'
  - id: 1061
    title: "Délai minimal entre deux changements de mot de passe"
    description: "Sans délai, un utilisateur enchaîne les changements pour revenir à son ancien mot de passe."
    remediation: "Fixer PASS_MIN_DAYS à 1 ou plus dans /etc/login.defs."
    severity: low
    category: authentication
    compliance:
