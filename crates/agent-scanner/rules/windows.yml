title: Script PowerShell d'un outil offensif connu
id: 4de89714-22f8-5c04-a8e3-013942a8377c
status: stable
description: Un bloc de script PowerShell contient le nom d'une fonction d'un outil offensif connu, ou une commande qui désactive les protections.
author: Sentinel GRC
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    service: powershell
detection:
    selection:
        EventID: 4104
        ScriptBlockText|contains:
            - Invoke-Mimikatz
            - Invoke-ReflectivePEInjection
            - Invoke-Shellcode
            - Invoke-Kerberoast
            - Invoke-BloodHound
            - Get-GPPPassword
            - amsiInitFailed
            - System.Management.Automation.AmsiUtils
            - 'Set-MpPreference -DisableRealtimeMonitoring'
            - 'Add-MpPreference -ExclusionPath'
    condition: selection
level: high
