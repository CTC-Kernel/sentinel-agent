# Règles Sigma livrées avec l'agent Sentinel GRC.
#
# Elles s'appuient sur les champs que l'agent extrait des journaux (voir
# crates/agent-siem/src/decode.rs). Pour en ajuster une, copiez-la dans le
# dossier « sigma.d » avec le même `id` : votre version la remplace. Pour en
# désactiver une, ajoutez son `id` à « sigma.d/disabled-rules.txt ».
title: Échec d'ouverture de session Windows
id: 31d62dad-1a5c-5d31-bedf-0a6b34757b62
name: win_logon_failed
status: stable
description: Une ouverture de session Windows a échoué.
author: Sentinel GRC
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection
level: informational
---
title: Force brute sur l'ouverture de session Windows
id: 6d28c68d-5942-56ed-a668-d1689b0914e3
status: stable
description: Une même adresse a échoué de nombreuses fois à ouvrir une session Windows en quelques minutes.
author: Sentinel GRC
tags:
    - attack.credential_access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - win_logon_failed
    group-by:
        - src_ip
    timespan: 5m
    condition:
        gte: 10
level: high
---
title: Pulvérisation de mots de passe Windows
id: 59d2ae19-0d81-5402-a71a-66bcd07a350b
status: stable
description: Une même adresse a essayé de nombreux comptes Windows différents en quelques minutes.
author: Sentinel GRC
tags:
    - attack.credential_access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - win_logon_failed
    group-by:
        - src_ip
    timespan: 10m
    condition:
        field: TargetUserName
        gte: 6
level: high
