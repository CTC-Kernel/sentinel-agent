title: Service Windows installé avec une commande suspecte
id: de53f473-08ff-5780-a2b7-b7f1df400ee5
status: stable
description: Un service a été installé dont la commande lance un interpréteur, un outil de téléchargement, ou un programme placé dans un dossier accessible en écriture aux utilisateurs.
author: Sentinel GRC
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 7045
        ImagePath|contains:
            - powershell
            - pwsh
            - 'cmd.exe /c'
            - 'cmd /c'
            - '%COMSPEC%'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - 'ADMIN$'
            - rundll32
            - regsvr32
            - mshta
            - certutil
            - bitsadmin
    condition: selection
level: high
