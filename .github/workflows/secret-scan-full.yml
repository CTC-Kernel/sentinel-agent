name: Secret Scan (full history)

# The CI job only scans the commits of a push or pull request, so a commit that is
# reachable only from a tag or an old branch never goes through it. This workflow scans
# every commit of every branch and tag.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full:
    name: Gitleaks (all branches and tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
