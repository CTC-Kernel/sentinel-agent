name: CI

# THROWAWAY BRANCH — never merge. The real workflow is replaced by one job
# that runs the two changed crates on Windows, quickly.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: Probe the backup fix (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: agent-common tests
        timeout-minutes: 15
        run: |
          cargo test -p agent-common
      - name: Backup check tests
        timeout-minutes: 15
        if: always()
        run: |
          cargo test -p agent-scanner --lib checks::backup
