name: CI

# THROWAWAY BRANCH — never merge. The real workflow is replaced by two jobs
# that show what the Windows backup check sees on real machines.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  server:
    name: Probe wbadmin (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 1a. No wbadmin.exe, unit tests
        timeout-minutes: 20
        run: |
          cargo test -p agent-scanner --lib checks::backup
      - name: 1b. No wbadmin.exe, what the check says
        if: always()
        timeout-minutes: 10
        env:
          PROBE_EXPECT: none
        run: |
          cargo test -p agent-scanner --test probe_backup_output -- --nocapture
      - name: 2. Install Windows Server Backup
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Install-WindowsFeature Windows-Server-Backup | Format-List Success,RestartNeeded,ExitCode
          $wb = Join-Path $env:SystemRoot 'System32\wbadmin.exe'
          $o = & $wb get versions 2>&1
          "exit code: $LASTEXITCODE"
          $o | Out-String
          "old condition, -notmatch as written: $([bool]($o -notmatch 'ERROR'))"
          Get-Volume | Format-Table DriveLetter,FileSystemLabel,FileSystem,DriveType,Size,SizeRemaining
          exit 0
      - name: 3a. wbadmin.exe and no backup, unit tests
        if: always()
        timeout-minutes: 10
        run: |
          cargo test -p agent-scanner --lib checks::backup
      - name: 3b. wbadmin.exe and no backup, what the check says
        if: always()
        timeout-minutes: 10
        env:
          PROBE_EXPECT: none
        run: |
          cargo test -p agent-scanner --test probe_backup_output -- --nocapture
      - name: 4. Make two backups, one minute apart
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $wb = Join-Path $env:SystemRoot 'System32\wbadmin.exe'
          New-Item -ItemType Directory -Force C:\wbsrc | Out-Null
          Set-Content C:\wbsrc\one.txt 'first'
          "=== first backup, to D:"
          & $wb start backup '-backupTarget:D:' '-include:C:\wbsrc' -quiet 2>&1 | Out-String
          $code = $LASTEXITCODE
          "start backup exit code: $code"
          $target = '-backupTarget:D:'
          if ($code -ne 0) {
            "=== first backup again, to a share"
            New-Item -ItemType Directory -Force C:\wbshare | Out-Null
            New-SmbShare -Name wbshare -Path C:\wbshare -FullAccess Everyone | Out-Null
            $target = '-backupTarget:\\localhost\wbshare'
            & $wb start backup $target '-include:C:\wbsrc' -quiet 2>&1 | Out-String
            "start backup (share) exit code: $LASTEXITCODE"
          }
          "=== versions after one backup"
          & $wb get versions 2>&1 | Out-String
          "get versions exit code: $LASTEXITCODE"
          "now (local): $(Get-Date -Format o)   now (UTC): $((Get-Date).ToUniversalTime().ToString('o'))"
          Start-Sleep -Seconds 75
          Set-Content C:\wbsrc\two.txt 'second'
          "=== second backup"
          & $wb start backup $target '-include:C:\wbsrc' -quiet 2>&1 | Out-String
          "start backup exit code: $LASTEXITCODE"
          "=== versions after two backups"
          $o = & $wb get versions 2>&1
          "get versions exit code: $LASTEXITCODE"
          $o | Out-String
          "now (local): $(Get-Date -Format o)   now (UTC): $((Get-Date).ToUniversalTime().ToString('o'))"
          "culture: $((Get-Culture).Name)   time zone: $((Get-TimeZone).Id)"
          "=== what the old script took as the last backup date"
          $versionMatch = $o | Select-String -Pattern 'Backup time: (.+)'
          if ($versionMatch) { $versionMatch.Matches[0].Groups[1].Value }
          "=== shadow copies"
          Get-WmiObject Win32_ShadowCopy | Format-Table InstallDate,VolumeName,DeviceObject
          exit 0
      - name: 5a. wbadmin.exe and backups, unit tests
        if: always()
        timeout-minutes: 10
        run: |
          cargo test -p agent-scanner --lib checks::backup
      - name: 5b. wbadmin.exe and backups, what the check says
        if: always()
        timeout-minutes: 10
        env:
          PROBE_EXPECT: Windows Backup
        run: |
          cargo test -p agent-scanner --test probe_backup_output -- --nocapture
